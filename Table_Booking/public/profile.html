        <main class="container py-5">

                                <!-- <div class="mb-3">

                                </div> -->

        <script>
            let isEditing = false;

            // Toggle Edit Mode
            document.getElementById('editProfileBtn').addEventListener('click', () => {
                isEditing = !isEditing;
                document.getElementById('profileForm').querySelectorAll('input').forEach(input => {
                    input.disabled = !isEditing;
                });
                document.getElementById('saveChangesBtn').style.display = isEditing ? 'block' : 'none';
                document.getElementById('editProfileBtn').textContent = isEditing ? 'Cancel' : 'Edit Profile';
            });

            // Load recent orders
            const orders = [
                { orderId: '123456', itemsCount: 2, totalPrice: 99.98, status: 'Delivered' },
                { orderId: '123457', itemsCount: 1, totalPrice: 49.99, status: 'Delivered' },
                { orderId: '123458', itemsCount: 3, totalPrice: 150.00, status: 'Pending' },
            ];

            const ordersContainer = document.getElementById('orders');
            orders.forEach(order => {
                const orderDiv = document.createElement('div');
                orderDiv.classList.add('p-3', 'border', 'rounded', 'mb-3', 'd-flex', 'justify-content-between', 'align-items-start', 'cursor-pointer', 'hover:bg-light');
                orderDiv.innerHTML = `
            <div>
              <p class="fw-bold">Order #${order.orderId}</p>
              <p class="text-muted">${order.itemsCount} items • $${order.totalPrice}</p>
            </div>
            <span class="order-status">${order.status}</span>
          `;
                ordersContainer.appendChild(orderDiv);
            });
        </script>

        <!-- Template Javascript -->

        <!-- Profile Dropdown Script -->
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const profileButton = document.getElementById('profile-button');
                const profileMenu = document.getElementById('profile-menu');
                const profileOverlay = document.getElementById('profile-overlay');
                const profileDropdown = document.getElementById('profile-dropdown');
                const signoutBtn = document.getElementById('signout-btn');

                if (profileButton) {
                    profileButton.addEventListener('click', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        profileMenu.classList.toggle('show');
                        profileOverlay.classList.toggle('show');
                    });
                }

                if (profileOverlay) {
                    profileOverlay.addEventListener('click', function() {
                        profileMenu.classList.remove('show');
                        profileOverlay.classList.remove('show');
                    });
                }

                document.addEventListener('click', function(e) {
                    if (profileDropdown && !profileDropdown.contains(e.target)) {
                        profileMenu.classList.remove('show');
                        profileOverlay.classList.remove('show');
                    }
                });

                if (signoutBtn) {
                    signoutBtn.addEventListener('click', async function(e) {
                        e.preventDefault();
                        try {
                            const response = await fetch('/logout', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' }
                            });
                            if (response.ok) {
                                window.location.href = '/login.html';
                            }
                        } catch (error) {
                            console.error('Logout error:', error);
                            window.location.href = '/login.html';
                        }
                    });
                }

                fetch('/check-auth')
                    .then(response => response.json())
                    .then(data => {
                        if (data.isLoggedIn && data.user) {
                            const profileName = document.getElementById('profile-name');
                            const profileAvatar = document.getElementById('profile-avatar');
                            if (profileName && data.user.name) {
                                profileName.textContent = data.user.name;
                            }
                            if (profileAvatar && data.user.name) {
                                profileAvatar.textContent = data.user.name.charAt(0).toUpperCase();
                            }
                        }
                    })
                    .catch(error => console.error('Error fetching user data:', error));
            });
        </script>
