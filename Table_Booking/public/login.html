<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Login</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Nunito:wght@600;700;800&family=Pacifico&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.4/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/lib/animate/animate.min.css" rel="stylesheet">
    <link href="/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
    <link href="/lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css" rel="stylesheet" />
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, var(--dark) 0%, #1a2332 50%, var(--dark) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(254, 161, 22, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(241, 248, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .login-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            z-index: 1;
        }

        .modern-form-3d {
            position: relative;
            width: 100%;
            padding: 40px 35px;
            background: linear-gradient(145deg, rgba(241, 248, 255, 0.95) 0%, rgba(255, 255, 255, 0.98) 100%);
            border-radius: 24px;
            box-shadow: 
                0 20px 60px rgba(15, 23, 43, 0.4),
                0 8px 24px rgba(15, 23, 43, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.6),
                inset 0 -1px 0 rgba(15, 23, 43, 0.1);
            transform-style: preserve-3d;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .modern-form-3d:hover {
            transform: translateY(-5px) rotateX(2deg);
            box-shadow: 
                0 30px 80px rgba(15, 23, 43, 0.5),
                0 12px 32px rgba(15, 23, 43, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.7),
                inset 0 -1px 0 rgba(15, 23, 43, 0.15);
        }

        .form-title-3d {
            font-size: 32px;
            font-weight: 700;
            color: var(--dark);
            margin: 0 0 8px;
            text-align: center;
            letter-spacing: -0.02em;
            text-shadow: 
                0 2px 4px rgba(15, 23, 43, 0.1),
                0 1px 2px rgba(15, 23, 43, 0.05);
            transform: translateZ(20px);
        }

        .form-subtitle {
            text-align: center;
            color: rgba(15, 23, 43, 0.6);
            font-size: 14px;
            margin-bottom: 32px;
            transform: translateZ(10px);
        }

        .input-wrapper-3d {
            position: relative;
            margin-bottom: 24px;
            transform-style: preserve-3d;
        }

        .form-input-3d {
            width: 100%;
            height: 52px;
            padding: 0 50px 0 50px;
            font-size: 15px;
            border: 2px solid rgba(15, 23, 43, 0.1);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.9);
            color: var(--dark);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 4px 12px rgba(15, 23, 43, 0.08),
                inset 0 2px 4px rgba(255, 255, 255, 0.5);
            transform: translateZ(0);
        }

        .form-input-3d::placeholder {
            color: rgba(15, 23, 43, 0.4);
        }

        .form-input-3d:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 1);
            box-shadow: 
                0 8px 24px rgba(254, 161, 22, 0.2),
                0 4px 12px rgba(15, 23, 43, 0.1),
                inset 0 2px 4px rgba(255, 255, 255, 0.6),
                0 0 0 4px rgba(254, 161, 22, 0.1);
            transform: translateY(-2px) translateZ(5px);
        }

        .input-icon-3d {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: rgba(15, 23, 43, 0.5);
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .form-input-3d:focus ~ .input-icon-3d {
            color: var(--primary);
            transform: translateY(-50%) scale(1.1);
        }

        .password-toggle-3d {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            padding: 8px;
            background: none;
            border: none;
            color: rgba(15, 23, 43, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .password-toggle-3d:hover {
            color: var(--primary);
            transform: translateY(-50%) scale(1.15);
        }

        .eye-icon-3d {
            width: 20px;
            height: 20px;
        }

        .submit-button-3d {
            position: relative;
            width: 100%;
            height: 56px;
            margin-top: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, #ffb84d 100%);
            color: var(--dark);
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 8px 24px rgba(254, 161, 22, 0.3),
                0 4px 12px rgba(254, 161, 22, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transform: translateZ(10px);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .submit-button-3d::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .submit-button-3d:hover {
            transform: translateY(-3px) translateZ(15px);
            box-shadow: 
                0 12px 32px rgba(254, 161, 22, 0.4),
                0 6px 16px rgba(254, 161, 22, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
            background: linear-gradient(135deg, #ffb84d 0%, var(--primary) 100%);
        }

        .submit-button-3d:hover::before {
            left: 100%;
        }

        .submit-button-3d:active {
            transform: translateY(-1px) translateZ(5px);
            box-shadow: 
                0 4px 12px rgba(254, 161, 22, 0.3),
                inset 0 2px 4px rgba(15, 23, 43, 0.2);
        }

        .button-text-3d {
            position: relative;
            z-index: 1;
        }

        .form-footer-3d {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
            transform: translateZ(5px);
        }

        .login-link-3d {
            color: rgba(15, 23, 43, 0.7);
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .login-link-3d span {
            color: var(--primary);
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .login-link-3d:hover {
            color: var(--dark);
            transform: translateX(2px);
        }

        .login-link-3d:hover span {
            color: #ffb84d;
            text-shadow: 0 0 8px rgba(254, 161, 22, 0.3);
        }

        .forgot-link {
            display: block;
            margin-top: 12px;
            color: rgba(15, 23, 43, 0.6);
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .forgot-link:hover {
            color: var(--primary);
        }

        #message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            transform: translateZ(5px);
            transition: all 0.3s ease;
        }

        @media (max-width: 576px) {
            .login-container {
                padding: 15px;
            }

            .modern-form-3d {
                padding: 30px 25px;
                border-radius: 20px;
            }

            .form-title-3d {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <form class="modern-form-3d mx-auto" method="post" id="loginForm">
            <div class="form-title-3d">Welcome Back</div>
            <div class="form-subtitle">Login to your account</div>

            <div class="form-body">
                <div class="input-wrapper-3d">
                    <svg fill="none" viewBox="0 0 24 24" class="input-icon-3d">
                                <path stroke-width="1.5" stroke="currentColor"
                                    d="M3 8L10.8906 13.2604C11.5624 13.7083 12.4376 13.7083 13.1094 13.2604L21 8M5 19H19C20.1046 19 21 18.1046 21 17V7C21 5.89543 20.1046 5 19 5H5C3.89543 5 3 5.89543 3 7V17C3 18.1046 3.89543 19 5 19Z">
                                </path>
                            </svg>
                    <input name="email" required placeholder="Email Address" class="form-input-3d" type="email"
                                id="loginEmail" />
                </div>

                <div class="input-wrapper-3d">
                    <svg fill="none" viewBox="0 0 24 24" class="input-icon-3d">
                                <path stroke-width="1.5" stroke="currentColor"
                                    d="M12 10V14M8 6H16C17.1046 6 18 6.89543 18 8V16C18 17.1046 17.1046 18 16 18H8C6.89543 18 6 17.1046 6 16V8C6 6.89543 6.89543 6 8 6Z">
                                </path>
                            </svg>
                    <input name="password" required placeholder="Password" class="form-input-3d" type="password"
                                id="loginPassword" />
                    <button class="password-toggle-3d" type="button" id="togglePassword">
                        <svg fill="none" viewBox="0 0 24 24" class="eye-icon-3d">
                                    <path stroke-width="1.5" stroke="currentColor"
                                        d="M2 12C2 12 5 5 12 5C19 5 22 12 22 12C22 12 19 19 12 19C5 19 2 12 2 12Z">
                                    </path>
                                    <circle stroke-width="1.5" stroke="currentColor" r="3" cy="12" cx="12"></circle>
                                </svg>
                            </button>
                </div>
            </div>

            <button class="submit-button-3d w-100" type="submit">
                <span class="button-text-3d">Login</span>
            </button>
            <div id="message"></div>

            <div class="form-footer-3d">
                <a class="login-link-3d" href="signup.html">
                    Don't have an account? <span>Sign Up</span>
                </a>
                <a href="/forgot-password" class="forgot-link">Forgot Password?</a>
            </div>
        </form>
    </div>

    <script>
        // Password toggle
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('loginPassword');
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
        });

        // Form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const messageDiv = document.getElementById('message');
            const submitButton = document.querySelector('.submit-button-3d');

            // Disable button during submission
            submitButton.disabled = true;
            submitButton.textContent = 'Logging in...';

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });

                const data = await response.json();
                if (response.ok) {
                    messageDiv.style.color = '#10b981';
                    messageDiv.style.background = 'rgba(16, 185, 129, 0.1)';
                    messageDiv.textContent = data.message || 'Login successful!';
                    setTimeout(() => {
                        window.location.href = data.redirectUrl || '/index.html';
                    }, 1000);
                } else {
                    messageDiv.style.color = '#ef4444';
                    messageDiv.style.background = 'rgba(239, 68, 68, 0.1)';
                    messageDiv.textContent = data.message || 'Login failed. Please try again.';
                    submitButton.disabled = false;
                    submitButton.innerHTML = '<span class="button-text-3d">Login</span>';
                }
            } catch (err) {
                messageDiv.style.color = '#ef4444';
                messageDiv.style.background = 'rgba(239, 68, 68, 0.1)';
                messageDiv.textContent = 'An error occurred. Please try again later.';
                submitButton.disabled = false;
                submitButton.innerHTML = '<span class="button-text-3d">Login</span>';
            }
        });
    </script>
</body>

</html>
